<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Test Page</title>
</head>
<body>
    <h1>AI Agent Browser Test</h1>

    <p>Use this page to test browser interaction.</p>

    <label for="name">Enter your name:</label>
    <input type="text" id="name" placeholder="Enter name">

    <button id="showName" type="button">Show Name</button>

    <p id="result"></p>

    <script>
        document.getElementById("showName").addEventListener("click", () => {
            const name = document.getElementById("name").value.trim();

            document.getElementById("result").textContent =
                name ? `Hello, ${name}!` : "Please enter your name.";
        });
    </script>
</body>
</html>
